name: "xscen Testing Suite"

on:
  push:
    branches:
      - main
    paths-ignore:
      - .cruft.json
      - CHANGELOG.rst
      - README.rst
      - pyproject.toml
      - src/xscen/__init__.py
  pull_request:

concurrency:
  # For a given workflow, if we push to the same branch, cancel all previous builds on that branch except on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Python${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.13" ]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CI libraries
        run: |
          python -m pip install --require-hashes -r CI/requirements_ci.txt
      - name: Environment Caching
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tox
          key: ${{ hashFiles('pyproject.toml', 'tox.toml') }}-lint
      - name: Run linting suite
        run: |
          python -m tox -e lint

  test-pypi:
    name: Test with Python${{ matrix.python-version }} (tox, ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # FIXME: Remove before merging to 'main'
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: [ "3.11", "3.12", "3.13" ]
        esmf-version: [ "8.7.0" ]  # 8.8.0 breaks h5py
        xclim-pre: [ false ]
        xclim-upstream: [ "main" ]  # FIXME: Remove before merging to 'main'
        xsdba-upstream: [ "xclim_v1" ]  # FIXME: Remove before merging to 'main'
        include:
          - os: "macos-latest"
            esmf-version: "8.7.0"
            python-version: "3.12"
            xclim-pre: true
            xclim-upstream: "main"  # FIXME: Remove before merging to 'main'
            xsdba-upstream: [ "xclim_v1" ]  # FIXME: Remove before merging to 'main'
          - os: "ubuntu-latest"
            esmf-version: "8.7.0"
            python-version: "3.14"
            xclim-pre: true
            xclim-upstream: "main"  # FIXME: Remove before merging to 'main'
            xsdba-upstream: [ "xclim_v1" ]  # FIXME: Remove before merging to 'main'
          # FIXME: setup-micromamba and Windows images fail with code 3221225781 (STATUS_ACCESS_VIOLATION)
          # - os: "windows-latest"
          #   esmf-version: "8.7.0"
          #   python-version: "3.11"
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Conda (Micromamba) with Python ${{ matrix.python-version }}
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          cache-downloads: true
          cache-environment: true
          environment-name: xscen-pypi
          create-args: >-
            esmf=${{ matrix.esmf-version }}
            hdf5
            python=${{ matrix.python-version }}
      - name: Set up Python${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CI libraries
        run: |
          python -m pip install --require-hashes -r CI/requirements_ci.txt
      - name: Environment Caching
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tox
          key: ${{ matrix.os }}-Python${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'tox.toml') }}
      - name: Test with tox (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m tox
        env:
          ESMF_VERSION: ${{ matrix.esmf-version }}
          XCLIM_PRE: ${{ matrix.xclim-pre }}
          XCLIM_UPSTREAM: ${{ matrix.xclim-upstream }}
          XCLIM_VERSION: ${{ matrix.xclim-version }}
          XSDBA_UPSTREAM: ${{ matrix.xsdba-upstream }}
      - name: Test with tox (macOS and Windows; no report failure)
        if: matrix.os != 'ubuntu-latest'
        run: |
          python -m tox || true
        env:
          ESMF_VERSION: ${{ matrix.esmf-version }}
          XCLIM_VERSION: ${{ matrix.xclim-version }}
      - name: Trust Coveralls Homebrew tap # Homebrew v6.0 requirement; Remove when coverallsapp/github-action >2.3.7
        if: matrix.os == 'macos-latest'
        run: |
          brew trust coverallsapp/coveralls
      - name: Report Coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          flag-name: run-Python${{ matrix.python-version }}-pypi-${{ matrix.os }}
          parallel: true

  test-conda:
    name: Test with Python${{ matrix.python-version }} (Anaconda, ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
        xclim-pre: [ true ]
        # FIXME: Uncomment when multiplatform tests are passing
        # include:
        #   - os: 'macos-latest'
        #     python-version: "3.11"
        #   - os: 'windows-latest'
        #     python-version: "3.12"
    env:
      XCLIM_UPSTREAM: true
      XSDBA_UPSTREAM: true
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Conda (Micromamba) with Python ${{ matrix.python-version }}
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          cache-downloads: true
          cache-environment: true
          environment-file: environment-dev.yml
          create-args: >-
            python=${{ matrix.python-version }}
      - name: Install xclim (pre-releases)
        if: ${{ matrix.xclim-pre }}
        run: |
          python -m pip install --no-user --pre xclim
      - name: Install xclim (upstream)
        if: ${{ env.XCLIM_UPSTREAM }}
        run: |
          python -m pip install --no-user "xclim @ git+https://github.com/Ouranosinc/xclim.git@main"
      - name: Install xsdba (upstream)
        if: ${{ env.XSDBA_UPSTREAM }}
        run: |
          python -m pip install --no-user "xsdba @ git+https://github.com/Ouranosinc/xsdba.git@xclim_v1"
      - name: Compile catalogs and install xscen
        run: |
          make translate
          python -m pip install --no-user --no-deps .
      - name: Check versions
        run: |
          micromamba list
          python -m pip check || true
      - name: Test with pytest
        run: |
          python -m pytest --cov=xscen --cov-report=lcov
      - name: Report Coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          flag-name: run-Python${{ matrix.python-version }}-conda-${{ matrix.os }}
          parallel: true

  finish:
    needs:
      - test-pypi
      - test-conda
    runs-on: ubuntu-latest
    name: Finish
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Coveralls Finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel-finished: true
