realm: generic
indicators:
  quantile_98_tas:
    base: xsdba.properties.quantile
    outputs:
      - attrs:
          long_name: 98th quantile of the mean temperature
        var_name: quantile_98_tas
    input:
      da: tas
    parameters:
      q: 0.98
      group: time.season
  maximum_length_of_warm_spell:
    base: xsdba.properties.spell_length_distribution
    outputs:
      - attrs:
          long_name: Maximum spell length distribution when the mean temperature is larger or equal to the 90th quantile.
        var_name: maximum_length_of_warm_spell
    input:
      da: tas
    parameters:
      method: quantile
      condition: '>='
      thresh: 0.9
      statistic: max
  mean_tas:
    base: xsdba.properties.mean
    outputs:
      - attrs:
          long_name: Bias of the mean temperature
        var_name: mean_tas
    input:
      da: tas
  mean_tas_ratio_meas:
    base: xsdba.properties.mean
    outputs:
      - attrs:
          long_name: Bias of the mean temperature
        var_name: mean_tas_ratio_meas
    input:
      da: tas
    measure: ratio
