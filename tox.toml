envlist = [
  "lint",
  { product = [{ prefix = "py3.", start = 11, stop = 14 }] },
  "docs"
]
skip_missing_interpreters = true

[env.docs]
description = "Build the documentation with makefile under {basepython}"
labels = ["docs"]
dependency_groups = ["docs"]
extras = ["xesmf"]
commands = [
  ["make", "build-docs"]
]
commands_post = []
allowlist_externals = ["make"]

[env.doctests]
description = "Run documentation linters and doctests with pytest under {basepython}"
dependency_groups = ["docs", "test"]
commands = [
  ["pytest", "--no-cov", "--nbval", "docs/notebooks", "--durations=10", "{posargs}"],
  ["pytest", "--xdoctest", "xscen", "--durations=10", "{posargs}"]
]
commands_post = []

[env.lint]
description = "Run code quality compliance tests and French translation verifications under {basepython}"
labels = ["lint"]
skip_install = true
deps = []
dependency_groups = ["lint"]
commands_pre = [
  ["pip", "list"],
  ["pip", "check"]
]
commands = [
  ["make", "lint"],
  ["make", "checkfrench"]
]
commands_post = []
allowlist_externals = ["make"]

[env_run_base]
description = "Run tests with pytest under {basepython}"
setenv = { PYTEST_ADDOPTS = "--color=yes --cov=xscen --cov-report=lcov", PYTHONPATH = "{toxinidir}", CFLAGS = "-std=gnu17", XCLIM_PRE = "false" }
passenv = ["CI", "COVERALLS_*", "ESMFMKFILE", "ESMF_VERSION", "GITHUB_*", "NUMCODECS_*", "XARRAY_*", "XCLIM_*", 'XSDBA_*']
download = true
dependency_groups = ["test"]
deps = [
  "numpy>=2.2",
  { replace = "if", condition = "env.ESMF_VERSION", then = ["git+https://github.com/esmf-org/esmf.git@v{env:ESMF_VERSION}#subdirectory=src/addon/esmpy"], extend = true },
  { replace = "if", condition = "env.XARRAY_VERSION", then = ["xarray=={env:XARRAY_VERSION}"], extend = true },
  { replace = "if", condition = "env.XCLIM_VERSION", then = ["xclim=={env:XCLIM_VERSION}"], extend = true },
  { replace = "if", condition = "env.XCLIM_UPSTREAM", then = ["xclim @ git+https://github.com/Ouranosinc/xclim.git@{env:XCLIM_UPSTREAM}"], extend = true },
  { replace = "if", condition = "env.XSDBA_UPSTREAM", then = ["xsdba @ git+https://github.com/Ouranosinc/xsdba.git@{env:XSDBA_UPSTREAM}"], extend = true }
]
install_command = ["python", "-m", "pip", "install", "--no-user", "{opts}", "{packages}"]
commands_pre = [
  { replace = "if", condition = "env.NUMCODECS_COMPILE", then = ["python", "-m", "pip", "install", "--upgrade", "--force-reinstall", "--no-user", "--no-cache-dir", "--no-binary", "numcodecs", "numcodecs<0.16.0"], extend = false },
  { replace = "if", condition = "env.XCLIM_PRE != 'false'", then = ["python", "-m", "pip", "install", "--no-user", "--upgrade", "--pre", "xclim"], extend = false },
  ["pip", "list"],
  ["pip", "check"]
]
commands = [
  ["pytest", "{posargs}"]
]
commands_post = [
  ["coverage", "report"]
]

[gh.python]
"3.11" = ["py3.11"]
"3.12" = ["py3.12"]
"3.13" = ["py3.13"]
"3.14" = ["py3.14"]
